name = "coherence-game"
main = "src/worker.ts"
compatibility_date = "2026-07-30"

[vars]
REDIRECT_TO = "https://decentralized-curation.0xferit.workers.dev"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "SIGNUPS"
class_name = "Signups"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Signups"]

[observability]
enabled = true
