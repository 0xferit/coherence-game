const DEFAULT_NOMINEES = NOMINEES.filter((nominee) => DEFAULT_DOCKET_KEYS.includes(nominee.key));
const SPARE_NOMINEES = NOMINEES.filter((nominee) => !DEFAULT_DOCKET_KEYS.includes(nominee.key));

function storageWorks() {
  try {
    localStorage.setItem(STORAGE_KEYS.probe, "1");
    localStorage.removeItem(STORAGE_KEYS.probe);
    return true;
  } catch {
    return false;
  }
}

function LS(key, value) {
  if (value === undefined) return localStorage.getItem(key);
  localStorage.setItem(key, value);
  return value;
}

function randomHex(bytes) {
  const a = new Uint8Array(bytes);
  crypto.getRandomValues(a);
  return Array.from(a, (b) => b.toString(16).padStart(2, "0")).join("");
}

function randomSalt() {
  const a = new Uint32Array(SALT_LENGTH);
  crypto.getRandomValues(a);
  return Array.from(a, (v) => SALT_WORDS[v % SALT_WORDS.length]).join(" ");
}

async function commitHash(score, salt) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(sealText(score, salt)));
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
}

function fmtScore(score) {
  return (score / SCORE_MAX).toFixed(2);
}

function proofText(score, salt) {
  return `${fmtScore(score)}  ${salt}`;
}

function parseProof(raw) {
  const parts = String(raw).trim().toLowerCase()
    .replace(/(\d),(\d)/g, "$1.$2")
    .replace(/[:·;,]/g, " ")
    .replace(/\s+/g, " ")
    .split(" ");
  const value = Number.parseFloat(parts[0]);
  if (!Number.isFinite(value) || parts.length < 2) return null;
  const score = value <= 1 ? Math.round(value * SCORE_MAX) : Math.round(value);
  if (score < SCORE_MIN || score > SCORE_MAX || !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(parts[0])) return null;
  return { score, salt: parts.slice(1).join(" ") };
}

function hash32(s) {
  let h = FNV32_OFFSET_BASIS;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, FNV32_PRIME);
  }
  return (h >>> 0) / UINT32_MAX;
}

function inBloc(pid, seed, fraction) {
  return hash32(`${pid}:${seed}`) < fraction;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function n(x) {
  return Math.round(x).toLocaleString(NUMBER_LOCALE);
}

function signed(d) {
  if (Math.round(d) === 0) return "0";
  return (d > 0 ? "+" : MINUS) + n(Math.abs(d));
}

}

function liveGame(snap) {
  const d = snap.exists ? snap.data() : null;
  return d && d.epoch && typeof d.nomineeIdx === "number" && Array.isArray(d.docket) ? d : null;
}

function me() {
  return players.find((p) => p.pid === myPid) || null;
}

function cur() {
  return state ? byNominee[state.nomineeIdx] : null;
}

function meta(i) {
  return nomineeMeta[i] || {};
}

function seatedForCurrentNominee() {
  return !!state && (meta(state.nomineeIdx).seated || []).includes(myPid);
}

function myPlay() {
  const c = cur();
  return c ? c.plays.find((p) => p.pid === myPid) || null : null;
}

function isHost() {
  return !!state && state.hostPid === myPid;
}

function nomineeDef() {
  return state ? nominees[state.nomineeIdx] : null;
}

function pname(pid) {
  const p = players.find((x) => x.pid === pid);
  return p ? p.name : "a juror who has left";
}

function hostName() {
  return state.hostPid === myPid ? "you" : pname(state.hostPid);
}

function saltKey(epoch, i, hash) {
  return `cg_seal_${epoch}_${i}_${hash}`;
}

function storedSeal(i, play, epoch = state && state.epoch) {
  if (!epoch || !play || !play.hash) return null;
  const key = saltKey(epoch, i, play.hash);
  return LS(key) || null;
}

function stateExpectation(game = state) {
  return { epoch: game.epoch, phase: game.phase, nomineeIdx: game.nomineeIdx, hostPid: game.hostPid };
}

function playExpectation(play) {
  return { hash: play?.hash ?? null, recused: play?.recused ?? null, revealed: play?.revealed ?? null };
}

function book() {
  return C.ledger(nominees, byNominee, players, state);
}

function pastHashes(play) {
  return ((play && play.past) || []).concat(play && play.hash ? [play.hash] : []);
}

function proofsOpen() {
  return !state || state.openProofs !== false;
}

function phaseIs(name) {
  return !!state && state.phase === name;
}

function act(label, promise) {
  return promise.then(
    () => {
      if (netMsg && netMsg.label === label) {
        netMsg = null;
        render();
      }
      return true;
    },
    (error) => {
      const conflict = error && error.code === ERR.CONFLICT;
      netMsg = { label, text: conflict ? "The game moved on before that landed. Look again." : `Could not ${label}: ${error && error.message ? error.message : "no answer from the room"}.` };
      render();
      return false;
    },
  );
}

function initialState(epoch, docket, hostPid) {
  return { phase: GAME_PHASE.LOBBY, nomineeIdx: 0, hostPid, epoch, seed: randomHex(SEED_BYTES), blocFraction: BLOC_FRACTION, openProofs: true, docket };
}

function chosenDocket() {
  const known = KNOWN_NOMINEES.filter((d) => pickedKeys.has(d.key));
  return known.concat(customNominees).slice(0, MAX_NOMINEES);
}

async function summonJury(name) {
  if (busy) return;
  busy = true;
  seatMsg = null;
  render();
  try {
    const lease = await stateRef().acquire({ holder: myPid, ttlMs: SUMMON_LEASE_MS });
    if (!lease.acquired) {
      seatMsg = "Someone else is summoning a jury right now.";
    } else if (liveGame(await stateRef().get())) {
      seatMsg = "A jury is already summoned. Take a seat in it.";
    } else {
      const epoch = randomHex(EPOCH_BYTES);
      await stateRef().set(initialState(epoch, chosenDocket(), myPid), { stamp: ["startedAt"], expect: { epoch: null } });
      await playersRef(epoch).doc(myPid).set({ pid: myPid, name }, { stamp: ["joinedAt"] });
    }
  } catch (error) {
    seatMsg = `Could not summon a jury: ${error.message}.`;
  }
  busy = false;
  render();
}

async function takeSeat(name) {

}

function removeSeat(pid) {
  if (!isHost() || !phaseIs(GAME_PHASE.LOBBY)) return;
  act("remove the seat", playersRef(state.epoch).doc(pid).delete());

async function openNominee() {
  if (!phaseIs(GAME_PHASE.LOBBY) || !isHost() || !rosterLoaded || !metaLoaded) return;
  const expect = stateExpectation();
  const i = state.nomineeIdx;
  const ep = state.epoch;
  if (!meta(i).openedAt) {
    const stamped = await act("open the nominee", nomineeDoc(ep, i).set({}, { stamp: ["openedAt"], expect: { openedAt: null } }));
    if (!stamped) return;
  }
  act("open the nominee", stateRef().update({ phase: GAME_PHASE.COMMIT }, { expect }));
}

function closeScoring() {
  if (!phaseIs(GAME_PHASE.COMMIT) || !isHost()) return;
  act("close the scoring", stateRef().update({ phase: GAME_PHASE.REVEAL }, { expect: stateExpectation() }));
}

async function gradeNominee() {
  if (!phaseIs(GAME_PHASE.REVEAL) || !isHost()) return;
  const expect = stateExpectation();
  const i = state.nomineeIdx;
  const ep = state.epoch;
  if (!meta(i).closedAt) {
    const stamped = await act("grade", nomineeDoc(ep, i).update({}, { stamp: ["closedAt"], expect: { closedAt: null } }));
    if (!stamped) return;
  }
  act("grade", stateRef().update({ phase: GAME_PHASE.GRADED }, { expect }));
}

function nextNominee() {
  if (!phaseIs(GAME_PHASE.GRADED) || !isHost()) return;
  const i = state.nomineeIdx;
  const expect = stateExpectation();
  const next = i + 1 < nominees.length ? { phase: GAME_PHASE.LOBBY, nomineeIdx: i + 1 } : { phase: GAME_PHASE.ENDED, gradedThrough: i + 1 };
  act("move on", stateRef().update(next, { expect }));
}

function endGame() {
  if (!isHost()) return;
  const through = state.nomineeIdx + (typeof meta(state.nomineeIdx).closedAt === "number" ? 1 : 0);
  pending = null;
  act("end the game", stateRef().update({ phase: GAME_PHASE.ENDED, gradedThrough: through }, { expect: stateExpectation() }));
}

function newGame() {
  if (!isHost()) return;
  pending = null;
  act("start a new game", stateRef().delete({ expect: stateExpectation() }));
}

function wipeAll() {
  if (!isHost()) return;
  pending = null;
  act("wipe the room", db.wipe());
}

function takeOver() {
  if (!state || !me()) return;
  pending = null;
  act("take over", stateRef().update({ hostPid: myPid }, { expect: stateExpectation() }));
}

function switchProofs() {
  if (!isHost()) return;
  act("switch the proofs", stateRef().update({ openProofs: !proofsOpen() }, { expect: stateExpectation() }));
}

async function sealScore() {
  if (!phaseIs(GAME_PHASE.COMMIT) || !seatedOk || !seatedForCurrentNominee()) return;
  const i = state.nomineeIdx;
  const epoch = state.epoch;
  const prior = myPlay();
  const salt = randomSalt();
  const score = myScore;
  const hash = await commitHash(score, salt);
  if (!phaseIs(GAME_PHASE.COMMIT) || state.epoch !== epoch || state.nomineeIdx !== i) return;
  const key = saltKey(epoch, i, hash);
  try { LS(key, sealText(score, salt)); }
  catch {
    netMsg = { label: "seal your score", text: "This browser could not save your seal. Free some site storage or use another browser before sealing." };
    render();
    return;
  }
  const ok = await act("seal your score", playsRef(epoch, i).doc(myPid).set({ pid: myPid, hash, past: pastHashes(prior), revealed: false }, { expect: playExpectation(prior) }));
  if (ok) {
    reseal = false;
    render();
  }
}

async function recuse() {
  if (!phaseIs(GAME_PHASE.COMMIT) || !seatedOk || !seatedForCurrentNominee()) return;
  const i = state.nomineeIdx;
  const prior = myPlay();
  const ok = await act("recuse yourself", playsRef(state.epoch, i).doc(myPid).set({ pid: myPid, recused: true, revealed: false, past: pastHashes(prior) }, { expect: playExpectation(prior) }));
  if (ok) {
    reseal = false;
    render();
  }
}

function unrecuse() {
  if (!phaseIs(GAME_PHASE.COMMIT) || !seatedOk || !seatedForCurrentNominee()) return;
  const prior = myPlay();
  act("take your seat back", playsRef(state.epoch, state.nomineeIdx).doc(myPid).set({ pid: myPid, revealed: false, past: pastHashes(prior) }, { expect: playExpectation(prior) }));
}

async function reportProof(raw) {
  reportMsg = null;
  if (!phaseIs(GAME_PHASE.COMMIT)) {
    reportMsg = { kind: "amber", text: "Reports are taken while the scoring is open." };
    return render();
  }
  const proof = parseProof(raw);
  if (!proof) {
    reportMsg = { kind: "bad", text: "That is not a proof: a score, then the words." };
    return render();
  }
  try {
    const res = await db.report(nomineePath(state.epoch, state.nomineeIdx), proof);
    reportMsg = res.duplicate
      ? { kind: "amber", text: `${pname(res.leakerPid)} was already reported.` }
      : { kind: "good", text: `Reported ${pname(res.leakerPid)}. +${n(LEAK_BOUNTY)}.` };
    const box = document.getElementById("rep");
    if (box) box.value = "";
  } catch (error) {
    reportMsg = { kind: "bad", text: error.message };
  }
  return render();
}

function openMySeals() {
  if (!db || !state || !seatedOk || !stateLoaded || !metaLoaded) return;
  byNominee.forEach((c, i) => {
    if (!c.playsLoaded) return;
    const closed = C.isGraded(state, i, nominees.length) || (i === state.nomineeIdx && state.phase === GAME_PHASE.REVEAL);
    if (!closed) return;
    const mine = c.plays.find((p) => p.pid === myPid);
    if (!mine || !mine.hash || mine.recused || mine.revealed) return;
    const stored = storedSeal(i, mine);
    if (!stored) return;
    const key = `${state.epoch}/${i}/${mine.hash}`;
    if (opened.has(key)) return;
    opened.add(key);
    const sep = stored.indexOf(":");
    act("open your seal", playsRef(state.epoch, i).doc(myPid).update({ score: +stored.slice(0, sep), salt: stored.slice(sep + 1), revealed: true }, { expect: { hash: mine.hash } }))
      .then((ok) => { if (!ok) opened.delete(key); });
  });
}

function secondsLeft() {
  if (!phaseIs(GAME_PHASE.COMMIT)) return null;
  const openedAt = meta(state.nomineeIdx).openedAt;
  if (!openedAt) return null;
  return Math.max(0, Math.ceil((COMMIT_DURATION_S * MILLISECONDS_PER_SECOND - (db.now() - openedAt)) / MILLISECONDS_PER_SECOND));
}

function setStatus() {

    b.push(`<span><b>${players.length}</b> seated</span>`);
    const s = secondsLeft();
    if (s !== null) b.push(`<span class="${s <= EXPIRING_WARNING_S ? "warn" : ""}"><b>${s}s</b> to seal</span>`);
    const ledgerLoaded = rosterLoaded && metaLoaded && byNominee.every((_, i) => !C.isGraded(state, i, nominees.length) || loadedFor(i));
    const bal = ledgerLoaded ? book().balance[myPid] : 0;

  const confirm = { end: ["cEnd", "Confirm: end the game"], new: ["cNew", "Confirm: new game"], wipe: ["cWipe", "Confirm: delete everything in this room"] }[pending];
  if (confirm) return `<button class="danger" id="${confirm[0]}">${confirm[1]}</button><button class="ghost" id="cX">Cancel</button>`;
  return `${state.phase !== GAME_PHASE.ENDED ? '<button class="ghost" id="bEnd">End the game</button>' : ""}<button class="ghost" id="bNew">New game</button><button class="ghost" id="bWipe">Wipe all</button>`;
}

function console_() {
  if (!state || !isHost()) return "";
  return `<div class="console"><span class="ck">Host console</span><button class="ghost" id="pSw">Proofs: ${proofsOpen() ? "on screen" : "behind a button"}</button>${resetControls()}</div>`;
}

function wireHost() {
  const handlers = {
    takeover: () => { pending = "take"; render(); },
    cTake: takeOver,
    bEnd: () => { pending = "end"; render(); },
    cEnd: endGame,
    bNew: () => { pending = "new"; render(); },
    cNew: newGame,
    bWipe: () => { pending = "wipe"; render(); },
    cWipe: wipeAll,
    cX: () => { pending = null; render(); },
    pSw: switchProofs,
  };
  for (const [id, fn] of Object.entries(handlers)) {
    const el = document.getElementById(id);
    if (el) el.addEventListener("click", fn);
  }
}

function revealGate() {
  const cc = cur() || { plays: [] };
  const left = secondsLeft();
  const seated = new Set(meta(state.nomineeIdx).seated || []);
  const relevant = cc.plays.filter((play) => seated.has(play.pid));
  const nSealed = relevant.filter((p) => p.sealed && !p.recused).length;
  const nRecused = relevant.filter((p) => p.recused).length;
  const unsealed = Math.max(0, seated.size - nSealed - nRecused);
  const why = unsealed === 0 ? "everyone has sealed or recused" : left === null ? "" : left === 0 ? `time is up, ${unsealed} did not seal` : `${unsealed} still sealing · ${left}s`;
  return { can: unsealed === 0 || left === null || left === 0, why, left, nSealed, nRecused };
}

let ticker = null;
function tickCommit() {
  const g = revealGate();
  setStatus();
  const b = document.getElementById("toReveal");
  if (b) b.disabled = !g.can;
  const w = document.getElementById("why");
  if (w) w.textContent = g.why;
  if (!g.left) tick(false);
}
function tick(on) {
  if (on && !ticker) ticker = setInterval(tickCommit, MILLISECONDS_PER_SECOND);
  else if (!on && ticker) {
    clearInterval(ticker);
    ticker = null;
  }
}

let dragging = false;
let redrawDeferred = false;
app.addEventListener("pointerdown", (e) => { if (e.target && e.target.type === "range") dragging = true; });
function dragEnd() {
  if (!dragging) return;
  dragging = false;
  if (redrawDeferred) {
    redrawDeferred = false;
    render();
  }
}
window.addEventListener("pointerup", dragEnd);
window.addEventListener("pointercancel", dragEnd);
window.addEventListener("blur", dragEnd);
window.addEventListener("storage", (event) => {
  if (event.key === null || event.key.startsWith("cg_")) render();
});
window.addEventListener("pagehide", () => { tick(false); if (db) db.close(); });
window.addEventListener("pageshow", (event) => { if (event.persisted) location.reload(); });

function keepInputs(draw) {
  const typed = {};
  const focused = document.activeElement;
  const fid = focused && focused.id;
  let sel = null;
  for (const i of app.querySelectorAll("input[type=text]")) if (i.id) typed[i.id] = i.value;
  if (fid && focused.tagName === "INPUT" && focused.type === "text") sel = [focused.selectionStart, focused.selectionEnd];
  draw();
  for (const [id, value] of Object.entries(typed)) {
    const e = document.getElementById(id);
    if (e && e.value !== value) e.value = value;
  }
  if (!fid) return;
  const f = document.getElementById(fid);
  if (!f) return;
  if (f !== document.activeElement) f.focus({ preventScroll: true });
  if (sel && f.type === "text") {
    try { f.setSelectionRange(sel[0], sel[1]); } catch {  }
  }
}

function render() {
  if (dragging) {
    redrawDeferred = true;
    return;
  }
  tick(false);
  setStatus();
  keepInputs(() => {
    if (!storageOk) return renderStorageBlocked();
    if (!roomCode) return renderNoRoom();
    if (!seatedOk) return renderConnecting();
    if (!stateLoaded) return renderConnecting();
    if (!state) return renderSummon();
    if (!rosterLoaded) return renderWaiting();
    if (!me()) return renderJoin();
    if (!metaLoaded) return renderWaiting();
    try { screen(); } catch (e) { renderBroken(e); }
  });
  openMySeals();
}

function loadedFor(i) {
  const c = byNominee[i];
  return !!(c && c.playsLoaded && c.leaksLoaded);
}

function screen() {
  if (!cur() || !nomineeDef()) return renderRecovery();
  if (!loadedFor(state.nomineeIdx) && state.phase !== GAME_PHASE.LOBBY) return renderWaiting();
  if (byNominee.some((_, i) => C.isGraded(state, i, nominees.length) && !loadedFor(i))) return renderWaiting();
  if (state.phase === GAME_PHASE.COMMIT) return renderCommit();
  if (state.phase === GAME_PHASE.REVEAL) return renderReveal();
  if (state.phase === GAME_PHASE.GRADED) return renderResults();
  if (state.phase === GAME_PHASE.ENDED) return renderDone();
  return renderLobby();
}

function pinLeft(score) {
  return PIN_INSET_PCT + score * (PERCENT_SCALE - 2 * PIN_INSET_PCT);
}

function trackHtml(g, valid) {
  const height = Math.max(TRACK_MIN_HEIGHT, valid.length * TRACK_ROW_HEIGHT);
  const ids = valid.map((v) => v.pid);
  const pins = g.graded.map((gr) => {
    const i = ids.indexOf(gr.pid);
    const top = TRACK_ROW_HEIGHT / 2 + ((i + 0.5) / Math.max(valid.length, 1)) * (height - TRACK_ROW_HEIGHT);
    const fill = gr.within
      ? `color-mix(in srgb, var(--upheld) ${(PIN_COLOR_MIN_PCT + gr.closeness * PIN_COLOR_SPAN_PCT).toFixed(1)}%, var(--paper))`
      : `color-mix(in srgb, var(--charge) ${(PIN_COLOR_MIN_PCT + gr.penalty * PIN_COLOR_SPAN_PCT).toFixed(1)}%, var(--paper))`;
    return `<span class="pin${gr.score >= LABEL_FLIP ? " flip" : ""}" style="left:${pinLeft(gr.score).toFixed(2)}%;top:${top.toFixed(1)}px"><i style="background:${fill}"></i><span>${esc(pname(gr.pid))}</span></span>`;
  }).join("");
  const PEAK = "color-mix(in srgb, var(--upheld) 34%, transparent)";
  const CAP = "color-mix(in srgb, var(--charge) 28%, transparent)";
  const at = (x) => pinLeft(C.clamp01(x)).toFixed(1);
  const grad = `linear-gradient(90deg,${CAP} ${at(g.lo - g.half)}%,transparent ${at(g.lo)}%,${PEAK} ${at(g.centre)}%,transparent ${at(g.hi)}%,${CAP} ${at(g.hi + g.half)}%)`;
  const total = (x) => (x > 0 && x < 1 ? `<span class="track__total" style="left:${at(x)}%"></span>` : "");
  return `<div class="track" style="height:${height}px"><span class="track__penalty" style="background:${grad}"></span><span class="track__band" style="left:${at(g.lo)}%;width:${Math.max(0, pinLeft(C.clamp01(g.hi)) - pinLeft(C.clamp01(g.lo))).toFixed(1)}%"></span>${total(g.lo - g.half)}${total(g.hi + g.half)}<span class="track__centre" style="left:${at(g.centre)}%"></span>${pins}</div>` +
    '<div class="axis"><span>0.00</span><span>dotted line: total forfeit from here</span><span>1.00</span></div>';
}

function ranked() {
  const bk = book();
  const compareText = (a, b) => a === b ? 0 : a < b ? -1 : 1;
  return players.slice().sort((a, b) => (bk.balance[b.pid] || 0) - (bk.balance[a.pid] || 0) || compareText(a.name, b.name) || compareText(a.pid, b.pid));
}

function standingsHtml() {
  const bk = book();
  return `<table class="standings"><tbody>${ranked().map((pl, i, all) => {
    const d = bk.last[pl.pid];
    const bal = bk.balance[pl.pid] || 0;
    const tied = i > 0 && (bk.balance[all[i - 1].pid] || 0) === bal;
    return `<tr class="${pl.pid === myPid ? "me" : ""}"><td class="num" style="width:2rem;color:var(--muted)">${tied ? "=" : i + 1}</td><td>${esc(pl.name)}</td><td class="num ${typeof d !== "number" ? "" : d >= 0 ? "up" : "down"}">${typeof d !== "number" ? "" : signed(d)}</td><td class="num"><b>${signed(bal)}</b></td></tr>`;
  }).join("")}</tbody></table>`;
}

function blocBanner(c, r, g) {
  const assigned = r.valid.map((v) => v.pid).filter((pid) => inBloc(pid, state.seed, state.blocFraction));
  const target = Number.parseFloat(c.blocScore);
  const complied = r.valid.filter((p) => assigned.includes(p.pid) && Math.abs(p.score / SCORE_MAX - target) <= BLOC_TOLERANCE).map((p) => p.pid);
  const otherOut = g.graded.filter((x) => !x.within && !complied.includes(x.pid)).length;
  const blocOut = g.graded.filter((x) => !x.within && complied.includes(x.pid)).length;
  const blocShare = g.graded.filter((x) => x.within && complied.includes(x.pid)).reduce((s, x) => s + x.share, 0);
  const share = Math.round((assigned.length / Math.max(r.valid.length, 1)) * PERCENT_SCALE);
  const head = `Bloc assigned to ${share}% of the jury · ${complied.length} of ${assigned.length} complied`;
  if (!complied.length) return banner("good", head, "Nobody followed the instruction. The attack never happened.");
  if (blocOut > 0 && otherOut === 0) return banner("good", head, "The bloc sat outside the band and paid for it.");
  if (otherOut > 0) return banner("bad", head, `${otherOut} other juror${otherOut === 1 ? "" : "s"} and ${blocOut} following the bloc instruction forfeited; ${complied.length - blocOut} following the instruction stayed inside the band. A bloc can move a mean. The full design uses random stake-weighted draws and appeals to larger juries; neither is performed in this game.`);
  return banner("amber", head, `The bloc landed inside the band and took ${Math.round(blocShare * PERCENT_SCALE)}% of the pot. It moved the centre without costing anyone a forfeit.`);
}

function nextBtn() {

}

function wireNext() {
  const b = document.getElementById("next");
  if (b) b.addEventListener("click", nextNominee);
}

function lateRevealBanner() {
  const late = byNominee.flatMap((entry, i) => {
    const mine = entry.plays.find((play) => play.pid === myPid);
    return C.isGraded(state, i, nominees.length) && mine && mine.revealed && !C.countsAsRevealed(mine, entry.closedAt) ? [nominees[i].name] : [];
  });
  return late.length ? banner("bad", "Opened after grading", `Your seal for ${late.join(", ")} opened after grading and does not count. The ledger treats it as no reveal.`) : "";
}

function renderResults() {
  const c = nomineeDef();
  const bk = book();
  const r = bk.results[state.nomineeIdx];
  if (!r || !r.grading) {
    const leakNote = r && cur().leaks.length ? ` Fines and bounties for pre-revelation still apply: ${cur().leaks.map((l) => `${esc(pname(l.leakerPid))} → ${esc(pname(l.reporterPid))}`).join(", ")}.` : "";
    app.innerHTML = `${netBanner()}<div class="card"><h2>Void</h2><p class="fine">Nobody revealed: a quorum failure. Nobody is charged for silence.${leakNote}</p></div>${hostBar(nextBtn())}<div class="card"><h3>Standings</h3>${standingsHtml()}</div>${console_()}`;
    wireHost();
    wireNext();
    return;
  }
  const g = r.grading;
  const myNet = bk.last[myPid];
  const mine = g.graded.find((x) => x.pid === myPid);
  const leaks = cur().leaks;
  const wasLeaked = leaks.some((l) => l.leakerPid === myPid);
  const bounty = leaks.filter((l) => l.reporterPid === myPid).length;
  const up = (myNet || 0) >= 0;
  const label = !mine ? (r.recused.includes(myPid) ? "recused" : "no reveal") : mine.within ? "coherent" : "outlier";
  const verdict = typeof myNet === "number"
    ? `<div class="verdict ${up ? "win" : "lose"}"><span class="v-amt">${signed(myNet)}</span><span class="v-side"><span class="v-label">${label}${wasLeaked ? " · reported" : ""}${bounty ? " · bounty" : ""}</span><span class="v-stats">${mine ? `<span>you <b>${mine.score.toFixed(2)}</b></span>` : ""}<span>mean <b>${g.centre.toFixed(2)}</b></span><span>band <b>±${g.half.toFixed(3)}</b></span>${mine ? `<span>off by <b>${mine.distance.toFixed(3)}</b> · ${mine.bands.toFixed(1)} bands</span>` : ""}${mine && mine.within ? `<span>share of pot <b>${(mine.share * PERCENT_SCALE).toFixed(1)}%</b></span>` : ""}${mine && !mine.within ? `<span>forfeit <b>${(mine.penalty * PERCENT_SCALE).toFixed(0)}%</b> of stake</span>` : ""}</span></span></div>`
    : "";
  const leakBan = leaks.length ? banner("amber", `${leaks.length} reported for pre-revelation`, leaks.map((l) => `${pname(l.leakerPid)} → ${pname(l.reporterPid)}`).join(", ")) : "";
  app.innerHTML = netBanner() + lateRevealBanner() + verdict + (c.bloc ? blocBanner(c, r, g) : "") + leakBan +
    `<div class="split"><div class="stack"><div class="card">${trackHtml(g, r.valid)}` +
    `<div class="strip"><div class="g"><b>${g.coherentCount}</b><span>paid</span></div><div class="r"><b>${g.outlierCount}</b><span>forfeiting</span></div><div><b>${n(g.pot)}</b><span>pot: ${n(C.ROUND_REWARD)} reward + forfeits</span></div></div>` +
    '<table><thead><tr><th>Juror</th><th class="num">Score</th><th class="num">Off by</th><th class="num">Grade</th><th class="num">Net</th></tr></thead><tbody>' +
    g.graded.slice().sort((a, b) => a.score - b.score).map((x) => {
      const net = r.delta[x.pid] || 0;
      return `<tr class="${x.pid === myPid ? "me" : ""}"><td>${esc(pname(x.pid))}</td><td class="num">${x.score.toFixed(2)}</td><td class="num">${x.distance.toFixed(3)} · ${x.bands.toFixed(1)}×</td><td class="num ${x.within ? "up" : "down"}">${x.within ? `${(x.share * PERCENT_SCALE).toFixed(1)}% of pot` : `${(x.penalty * PERCENT_SCALE).toFixed(0)}% of stake`}</td><td class="num ${net >= 0 ? "up" : "down"}">${signed(net)}</td></tr>`;
    }).join("") + "</tbody></table>" +
    (r.absent.length ? `<p class="fine">${r.absent.map((pid) => esc(pname(pid))).join(", ")} did not reveal in time: −${n(GAME_ANTE)} each.</p>` : "") +
    (r.recused.length ? `<p class="fine">${r.recused.map((pid) => esc(pname(pid))).join(", ")} recused: no stake, no share, no fine for silence.</p>` : "") +
    (c.note ? `<p class="fine">${esc(c.note)}</p>` : "") +
    `<p class="fine">Off by is measured in bands of ±${g.half.toFixed(3)} (${C.K} × the jury’s spread${g.mad > g.madRaw ? `, floored at ${g.mad.toFixed(2)}` : ` of ${g.madRaw.toFixed(3)}`}). ${C.TOTAL_FORFEIT_BANDS} bands out is a total forfeit. Inside the band this game pays by closeness to the mean.</p>` +
    `</div></div><div class="stack"><div class="card"><h3>Standings</h3>${standingsHtml()}</div>${hostBar(nextBtn())}</div></div>${console_()}`;
  wireHost();
  wireNext();
}

function renderDone() {
  const bk = book();
  const through = typeof state.gradedThrough === "number" ? state.gradedThrough : nominees.length;
  const scored = nominees.slice(0, through).map((c) => c.name);
  app.innerHTML = `${netBanner()}${lateRevealBanner()}<div class="card"><h3>Final standing · ${through} of ${nominees.length} nominees scored</h3><h1>The jury’s final standings</h1><p class="fine">${esc(scored.join(" · "))}</p></div>` +
    `<div class="board">${ranked().map((pl, i, order) => {
      const bal = bk.balance[pl.pid] || 0;
      const firstAtBalance = order.findIndex((other) => (bk.balance[other.pid] || 0) === bal);
      const tied = order.some((other) => other.pid !== pl.pid && (bk.balance[other.pid] || 0) === bal);
      const soleWinner = i === 0 && !tied && bal > 0;
      return `<div class="seat${pl.pid === myPid ? " me" : ""}${soleWinner ? " first" : ""}"><span class="rank">${firstAtBalance + 1}${tied ? "=" : ""}</span><span class="who">${esc(pl.name)}</span><span class="amt ${bal > 0 ? "up" : bal < 0 ? "down" : ""}">${signed(bal)}</span></div>`;
    }).join("")}</div>` +
    '<div class="card"><p class="fine">Every balance here was derived from the sealed scores, the reveals and the reports, by every phone in the room, with the same arithmetic.</p>' +
    `<div class="row"><a href="${MAILING_LIST_PATH}"><button class="ghost">Join the Decentralized Curation mailing list</button></a><a href="${HANDOUT_PATH}"><button class="ghost">The one-page summary</button></a></div></div>` +
    hostBar("") + console_();
  wireHost();
}

function bind(ep) {
  if (subEpoch === ep) return;
  for (const u of subs) {
    try { u(); } catch {  }
  }
  subs = [];
  subEpoch = ep;
  players = [];
  rosterLoaded = false;
  metaLoaded = false;
  nomineeMeta = [];
  byNominee = nominees.map(() => ({ plays: [], leaks: [], playsLoaded: false, leaksLoaded: false }));
  if (!ep) return;
  subs.push(playersRef(ep).onSnapshot((s) => {
    players = s.docs.map((d) => d.data()).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    rosterLoaded = true;
    render();
  }, fatal));
  subs.push(nomineesCol(ep).onSnapshot((s) => {
    nomineeMeta = [];
    for (const d of s.docs) nomineeMeta[Number.parseInt(String(d.id).slice(ROOM_PATH.NOMINEE_PREFIX.length), 10)] = d.data();
    byNominee.forEach((c, i) => {
      const metadata = nomineeMeta[i] || {};
      c.openedAt = metadata.openedAt;
      c.closedAt = metadata.closedAt;
      c.seated = metadata.seated;
    });
    metaLoaded = true;
    render();
  }, fatal));
  nominees.forEach((_, i) => {
    subs.push(playsRef(ep, i).onSnapshot((s) => { byNominee[i].plays = s.docs.map((d) => d.data()); byNominee[i].playsLoaded = true; render(); }, fatal));
    subs.push(leaksRef(ep, i).onSnapshot((s) => { byNominee[i].leaks = s.docs.map((d) => d.data()); byNominee[i].leaksLoaded = true; render(); }, fatal));
  });
}

function fatal(error) {
  seatError = `a subscription failed (${error.message}); reload the page`;
  seatedOk = false;
  render();
}

let uiKey = null;
let phaseKey = null;
function resetUi() {
  const key = state ? `${state.epoch}/${state.nomineeIdx}` : null;
  const nextPhaseKey = state ? `${key}/${state.phase}` : null;
  if (nextPhaseKey !== phaseKey) {
    dragging = false;
    redrawDeferred = false;
    phaseKey = nextPhaseKey;
    pending = null;
  }
  if (key === uiKey) return;
  uiKey = key;
  seatMsg = null;
  joinFocused = false;
  showProof = false;
  reportMsg = null;
  reseal = false;
  myScore = NEUTRAL_SCORE;
}

async function takeSeatAtRoom() {
  try {
    await db.hello(myPid, mySecret);
    seatedOk = true;
    seatError = null;
  } catch (error) {
    seatError = error.message;
  }
  render();
}

function start() {
  if (!storageOk || !roomCode) {
    render();
    return;
  }
  const scheme = location.protocol === "https:" ? "wss://" : "ws://";
  db = connect(`${scheme}${location.host}${roomPath(roomCode, true)}`);
  db.onStatus((status) => {
    seatedOk = status === "open";
    if (!seatedOk) {
      stateLoaded = false;
      rosterLoaded = false;
      metaLoaded = false;
      for (const nominee of byNominee) {
        nominee.playsLoaded = false;
        nominee.leaksLoaded = false;
      }
    }
    render();
  });
  takeSeatAtRoom();
  stateRef().onSnapshot((s) => {
    stateLoaded = true;
    state = liveGame(s);
    nominees = state ? state.docket : [];
    resetUi();
    bind(state ? state.epoch : null);
    render();
  }, fatal);
  render();
}

start();
</script>
</body>
</html>
